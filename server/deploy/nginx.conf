# /etc/nginx/sites-available/italian-words  (installed by deploy/setup.sh)
# Reverse proxy: internet :80/:443 -> node 127.0.0.1:3100.
#
# HTTPS: point a DNS A record (e.g. api.example.com) to the VPS IP, then
#   certbot --nginx -d api.example.com -m you@example.com --agree-tos --redirect
# certbot adds the "listen 443 ssl" lines and the certificate paths to this file
# and renews automatically (systemd timer "certbot.timer").
# Android apps refuse plain http by default: the app must use the https:// address.

# extra per-IP shield in front of the node limiter (sites-enabled is inside http {})
limit_req_zone $binary_remote_addr zone=iw_lookup:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=iw_all:10m rate=10r/s;

upstream italian_words {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;            # setup.sh replaces "_" with $DOMAIN when given

    server_tokens off;
    client_max_body_size 4k;
    access_log /var/log/nginx/italian-words.access.log;
    error_log  /var/log/nginx/italian-words.error.log warn;

    # needed by certbot's http-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /v1/lookup {
        limit_req zone=iw_lookup burst=20 nodelay;
        limit_req_status 429;
        proxy_read_timeout 70s;      # a lookup may wait for Gemini (deadline 50s)
        proxy_pass http://italian_words;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=iw_all burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
        proxy_pass http://italian_words;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
